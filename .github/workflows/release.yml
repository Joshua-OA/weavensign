name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/
      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./mcp-server/package.json').version")
          if [ "v$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mcp-server version v$PKG_VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test
      - run: npm publish -w mcp-server --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
